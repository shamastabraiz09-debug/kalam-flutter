name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cirruslabs/flutter:3.22.0-stable
    steps:
      - uses: actions/checkout@v4

      - name: Create android platform
        run: |
          flutter create --platforms=android --project-name kalam .

      - name: Fix AndroidManifest
        run: |
          cat > android/app/src/main/AndroidManifest